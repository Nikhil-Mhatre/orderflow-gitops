apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the common web Kubernetes resources.
# The base contains the Deployment, Service, ConfigMap,
# HPA, and PDB.
resources:
  - ../../../apps/web

# Development uses a specific web image version.
# CI/CD can later replace this with the Git commit SHA
# of the application image.
images:
  - name: orderflow-web
    newName: nikhilmhatre0317/orderflow-web
    newTag: latest
