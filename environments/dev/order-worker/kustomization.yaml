apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the common order-worker Kubernetes resources.
# The base contains the Deployment, ConfigMap, and PDB.
resources:
  - ../../../apps/order-worker

# Development uses a specific worker image version.
# CI/CD can later replace this with the Git commit SHA
# of the application image.
images:
  - name: order-worker
    newName: order-worker
    newTag: dev
