# ---------------------------------------------------------------------------
# Argo CD Application: External Secrets Operator (ESO)
# ---------------------------------------------------------------------------
# This Application asks Argo CD to install ESO from its official Helm chart.
# ESO reads external secret providers such as AWS Secrets Manager and creates
# Kubernetes Secret resources from ExternalSecret custom resources.
#
# Prerequisites for the wider setup:
# - Argo CD must already be installed in the cluster.
# - The EKS Pod Identity Agent and the appropriate Pod Identity association
#   must be configured separately if ESO will use EKS Pod Identity.
# - The IAM role associated with ESO's ServiceAccount must have narrowly scoped
#   permissions to read only the required AWS Secrets Manager secrets.
# ---------------------------------------------------------------------------

# API group/version for Argo CD's Application custom resource.
apiVersion: argoproj.io/v1alpha1

# Tells Kubernetes this object describes an Argo CD Application.
kind: Application

# Metadata identifies this Application object.
metadata:
  # Application name shown in the Argo CD UI and CLI.
  name: external-secrets

  # Argo CD Applications are normally stored in the namespace where Argo CD runs.
  namespace: argocd

  # Annotations provide metadata consumed by Argo CD.
  annotations:
    # Sync wave -1 asks Argo CD to process this Application before resources
    # assigned to later waves in the same sync operation.
    # This does not guarantee that ESO's CRDs are established before a separate
    # Application starts applying ExternalSecret resources; separate Applications
    # may reconcile independently. If ordering is required, use an explicit
    # staged sync/bootstrap process or another dependency strategy.
    argocd.argoproj.io/sync-wave: "-1"

# Desired configuration for this Argo CD Application.
spec:
  # Argo CD AppProject that governs which repositories and destinations are allowed.
  # 'default' is the built-in project; use your workloads project if required.
  project: orderflow

  # Source configuration: where Argo CD gets the Helm chart.
  source:
    # Official External Secrets Operator Helm chart repository.
    repoURL: https://charts.external-secrets.io

    # Name of the chart to install from the repository above.
    chart: external-secrets

    # Helm chart version to install. Pinning a version makes deployments repeatable.
    # Verify compatibility with your Kubernetes version and approved chart version.
    targetRevision: 0.16.1

    # Helm-specific settings passed to the chart.
    helm:
      # Name Helm records for this chart release.
      releaseName: external-secrets

      # Inline Helm values in YAML format.
      values: |
        # Install the External Secrets Operator CRDs along with the chart.
        # These CRDs define types such as ExternalSecret and SecretStore.
        installCRDs: true

        # Configure the Kubernetes ServiceAccount used by the ESO controller.
        serviceAccount:
          # Let the Helm chart create and manage the ServiceAccount.
          # Do not also manage this same ServiceAccount from a separate manifest.
          create: true

          # Exact ServiceAccount name. The EKS Pod Identity association in
          # Terraform must use this name and the namespace below.
          name: external-secrets

  # Destination cluster and namespace for the ESO Helm release.
  destination:
    # Kubernetes API server for the cluster where this Argo CD instance runs.
    server: https://kubernetes.default.svc

    # Namespace where the ESO controller and its ServiceAccount will be installed.
    # Terraform's Pod Identity association must specify this same namespace.
    namespace: external-secrets

  # Controls how Argo CD reconciles the Helm release.
  syncPolicy:
    # Enable automatic synchronization when the desired chart/config changes.
    automated:
      # Revert live changes that differ from the desired configuration in Git.
      selfHeal: true

      # Delete resources managed by this Application when they are removed from
      # its desired state. Be careful with CRDs: deleting a CRD can affect all
      # custom resources of that type in the cluster.
      prune: true

    # Additional synchronization options.
    syncOptions:
      # Create the target namespace if it does not already exist.
      - CreateNamespace=true
