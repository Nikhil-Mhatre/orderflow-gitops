# Apply once after Argo CD is installed and repoURL is updated.
# This root app tracks the platform and API child Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops.git
    targetRevision: main
    path: bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
