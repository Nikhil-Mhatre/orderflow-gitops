apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: external-secrets
  namespace: argocd
spec:
  project: orderflow
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.16.1
      helm:
        releaseName: external-secrets
        values: |
          installCRDs: true
          serviceAccount:
            create: true
            name: external-secrets
          podLabels:
            app.kubernetes.io/managed-by: argocd
    - repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops.git
      targetRevision: main
      path: platform/external-secrets/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
