apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orderflow-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops
        revision: main
        directories:
          - path: apps/*/overlays/prod
  template:
    metadata:
      name: '{{path[1]}}'
      labels:
        app.kubernetes.io/part-of: orderflow
    spec:
      project: default
      source:
        repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: orderflow
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
