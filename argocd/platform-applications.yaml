apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-platform-alb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops
    targetRevision: main
    path: platform/alb
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
