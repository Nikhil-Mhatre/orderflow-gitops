apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-alb-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops
    targetRevision: main
    path: platform/alb
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Optional. Remove this Application if you do not need cert-manager.
# The example workload Ingresses currently use HTTP and do not reference certificates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.4
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
