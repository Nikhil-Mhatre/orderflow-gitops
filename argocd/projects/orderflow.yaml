# An AppProject is a set of permissions for Argo CD Applications.
# Applications that use this project may deploy only from the allowed Git
# repositories, to the allowed cluster namespaces, and with the allowed resource
# types listed below.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  # Applications select this policy by setting spec.project to "orderflow".
  name: orderflow
  # AppProjects are Argo CD objects, so keep this object in Argo CD's namespace.
  namespace: argocd
spec:
  description: Controls which Git repository, cluster namespaces, and Kubernetes resource types Orderflow Applications may deploy.
  # Git repositories that Applications in this project may deploy from.
  sourceRepos:
    - https://github.com/Nikhil-Mhatre/orderflow-gitops.git
    - https://charts.external-secrets.io
  # Cluster and namespace destinations that Applications may deploy to.
  # The server URL below means the Kubernetes cluster where Argo CD is running.
  destinations:
    - namespace: apps-dev
      server: https://kubernetes.default.svc
    - namespace: apps-prod
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    # This allows deployments to kube-system. Keep it only if an Application
    # in this project really needs to manage resources in this system namespace.
    - namespace: kube-system
      server: https://kubernetes.default.svc
  # Cluster-scoped resources do not belong to a namespace. Only these kinds
  # are allowed, which helps prevent workload Applications changing other
  # cluster-wide settings.
  clusterResourceWhitelist:
    # Namespace objects are cluster-scoped, even though they contain namespaced
    # workloads. Allow this so the environment Application can create apps-dev
    # and apps-prod from the namespace manifests in Git.
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: IngressClass
    - group: eks.amazonaws.com
      kind: IngressClassParams
  # Namespaced resource kinds that Applications may create or manage.
  # "*" allows every kind in every API group within the destinations above.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
