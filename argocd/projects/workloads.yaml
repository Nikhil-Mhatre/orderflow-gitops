# Optional AppProject for workloads managed from this repository.
# Apply this only if you want a project separate from Argo CD's built-in default project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  description: Application workloads managed from the GitOps repository.
  sourceRepos:
    - https://github.com/REPLACE_ME/REPLACE_ME-gitops.git
  destinations:
    - namespace: app-dev
      server: https://kubernetes.default.svc
    - namespace: app-prod
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: networking.k8s.io
      kind: IngressClass
    - group: eks.amazonaws.com
      kind: IngressClassParams
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
