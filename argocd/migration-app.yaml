# Optional dedicated Application for database migrations.
# Apply this only after replacing the repository URL and confirming the migration Job strategy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-migrations
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/REPLACE_ME-gitops.git
    targetRevision: main
    path: apps/migration/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
