apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-flow-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nikhil-Mhatre/orderflow-gitops.git
    targetRevision: main
    path: apps/order-flow/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: order-flow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
