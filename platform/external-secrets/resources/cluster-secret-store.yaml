apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No static credentials here. ESO uses the AWS SDK default credential chain.
      # Associate the ESO controller service account with an IAM role via EKS Pod Identity.
