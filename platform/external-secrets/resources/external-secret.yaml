apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db-credentials
  namespace: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_USER
      remoteRef:
        key: YOUR_APP_DB_SECRET_NAME
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: YOUR_APP_DB_SECRET_NAME
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: YOUR_APP_DB_SECRET_NAME
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: YOUR_APP_DB_SECRET_NAME
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: YOUR_APP_DB_SECRET_NAME
        property: dbname
