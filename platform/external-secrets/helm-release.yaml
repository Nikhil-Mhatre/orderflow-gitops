# Child Argo CD Application installs External Secrets Operator from the official Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.16.1
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        serviceAccount:
          create: true
          name: external-secrets
        # EKS Pod Identity / IRSA role association is configured outside GitOps.
        # If using IRSA, add the appropriate role-arn annotation here.
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
