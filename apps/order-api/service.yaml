apiVersion: v1
kind: Service

metadata:
  name: order-api
  labels:
    app: order-api

spec:
  # ClusterIP makes the API reachable inside the Kubernetes cluster.
  # It does not create a public endpoint by itself.
  type: ClusterIP

  # The Service forwards traffic to pods with this label.
  # This must match the Deployment's pod labels.
  selector:
    app: order-api

  ports:
    - name: http

      # Port exposed by the Kubernetes Service.
      port: 80

      # Port exposed by the order-api container.
      targetPort: http

      protocol: TCP
