apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: orderflow
spec:
  ingressClassName: alb
  rules:
    - host: frontend.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
