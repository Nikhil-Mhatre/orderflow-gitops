apiVersion: batch/v1
kind: Job
metadata:
  name: seed-products-v1
  namespace: order-flow
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-products
          image: seed-product:dev
          command: ["node"]
          args:
            - dist/db/seed/products.seed.js
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-flow-secrets
                  key: DATABASE_URL
