apiVersion: batch/v1
kind: Job
metadata:
  name: seed-products-v1
  namespace: order-flow
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-products
          image: seed-product:dev
          args:
            - dist/db/seed/products.seed.js
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: AWS_REGION
            - name: EVENTBRIDGE_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: EVENTBRIDGE_SOURCE
            - name: EVENT_BUS_NAME
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: EVENT_BUS_NAME
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-flow-secrets
                  key: DATABASE_URL
