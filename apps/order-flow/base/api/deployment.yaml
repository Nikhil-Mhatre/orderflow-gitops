apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: order-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: order-flow
    spec:
      containers:
        - name: api
          image: api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: AWS_REGION
            - name: EVENTBRIDGE_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: EVENTBRIDGE_SOURCE
            - name: EVENT_BUS_NAME
              valueFrom:
                configMapKeyRef:
                  name: order-flow-config
                  key: EVENT_BUS_NAME
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-flow-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
