apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: your-dockerhub-user/orderflow-worker:placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: orderflow-worker-config
            - secretRef:
                name: orderflow-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
