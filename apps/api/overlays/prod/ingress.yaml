apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: orderflow
spec:
  ingressClassName: alb
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
