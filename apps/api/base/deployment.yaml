apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: orderflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: nikhilmhatre0317/orderflow-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"

          envFrom:
            - secretRef:
                name: orderflow-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
