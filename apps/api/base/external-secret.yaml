apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db-credentials
  namespace: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: api-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN
        property: password
    - secretKey: host
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN
        property: host
    - secretKey: port
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN
        property: port
    - secretKey: dbname
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN
        property: dbname
