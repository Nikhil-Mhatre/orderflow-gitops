# Uses the AWS Secrets Manager provider. The ESO controller's IAM role must be
# supplied by EKS Pod Identity or IRSA and scoped to the target secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: api
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_AWS_REGION
      # Do not configure accessKeyIDSecretRef/secretAccessKeySecretRef.
      # Use the ESO controller's AWS workload identity.
