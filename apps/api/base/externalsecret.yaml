apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderflow-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # This is the Kubernetes Secret referenced by apps/api/base/deployment.yaml.
    name: orderflow-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # RDS-managed secret fields are used to construct the connection string.
        # Confirm the RDS secret JSON keys and URL-encode special characters in passwords.
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@orderflow-rds-postgres.cizuy6egq9jl.us-east-1.rds.amazonaws.com:5432/orderflow"
  data:
    # These fields are fetched from the JSON value of the RDS-managed secret.
    - secretKey: username
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN_OR_NAME
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_RDS_MANAGED_SECRET_ARN_OR_NAME
        property: password
    # # Weather API key is read from a separate Terraform-managed Secrets Manager secret.
    # - secretKey: WEATHER_API_KEY
    #   remoteRef:
    #     key: REPLACE_WITH_WEATHER_SECRET_ARN_OR_NAME
    #     property: api-key
