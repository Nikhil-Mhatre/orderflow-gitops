apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # Replace with the AWS region that contains the secrets.
      # No auth block is required for this setup: the ESO controller pod receives
      # AWS credentials through its EKS Pod Identity association.
