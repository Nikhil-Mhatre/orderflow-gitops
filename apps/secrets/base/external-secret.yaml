apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderflow-secrets
  namespace: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orderflow-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: orderflow-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /orderflow/dev/app
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: /orderflow/dev/app
        property: JWT_SECRET
