apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-web
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow-web
  template:
    metadata:
      labels:
        app: orderflow-web
    spec:
      containers:
        - name: web
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/orderflow-dev-web:REPLACE_ME
          ports:
            - name: http
              containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-web
  namespace: orderflow
spec:
  selector:
    app: orderflow-web
  ports:
    - name: http
      port: 80
      targetPort: http
