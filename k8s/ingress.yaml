apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: orderflow-alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: orderflow-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: orderflow-alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow
  namespace: orderflow
spec:
  ingressClassName: orderflow-alb
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderflow-api
                port:
                  number: 3001
    - host: web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderflow-web
                port:
                  number: 80
