apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-frontend
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow-frontend
  template:
    metadata:
      labels:
        app: orderflow-frontend
    spec:
      containers:
        - name: frontend
          image: nikhilmhatre0317/orderflow-web:latest
          ports:
            - name: http
              containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-frontend
  namespace: orderflow
spec:
  selector:
    app: orderflow-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow-frontend
  namespace: orderflow
spec:
  ingressClassName: orderflow-alb
  rules:
    - host: frontend.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderflow-frontend
                port:
                  number: 80
