apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
data:
  NODE_ENV: "production"
  AWS_REGION: "us-east-1"
  EVENT_BUS_NAME: "orderflow-dev-events"
  SQS_QUEUE_URL: "REPLACE_WITH_ORDERFLOW_QUEUE_URL"
  SQS_DLQ_URL: "REPLACE_WITH_ORDERFLOW_DLQ_URL"
  DB_HOST: "REPLACE_WITH_RDS_ENDPOINT"
  DB_PORT: "5432"
  DB_NAME: "orderflow"
