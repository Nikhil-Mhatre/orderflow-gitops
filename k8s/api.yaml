apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-api
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow-api
  template:
    metadata:
      labels:
        app: orderflow-api
    spec:
      serviceAccountName: orderflow-app
      containers:
        - name: api
          image: nikhilmhatre0317/orderflow-api:latest
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-api
  namespace: orderflow
spec:
  selector:
    app: orderflow-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow-api
  namespace: orderflow
spec:
  ingressClassName: orderflow-alb
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orderflow-api
                port:
                  number: 3001
