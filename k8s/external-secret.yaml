apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: orderflow-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderflow-secrets
  namespace: orderflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orderflow-aws-secrets
    kind: ClusterSecretStore
  target:
    name: orderflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /orderflow/dev/database
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: /orderflow/dev/app
        property: JWT_SECRET
