apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderflow-app-secrets
  namespace: orderflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: orderflow-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /orderflow/dev/database
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: /orderflow/dev/app
        property: JWT_SECRET
